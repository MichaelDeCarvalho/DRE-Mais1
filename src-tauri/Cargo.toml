[package]
name = "dre-mais1"
version = "0.1.5"
edition = "2021"

[lib]
name = "dre_mais1_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
calamine = "0.36"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
