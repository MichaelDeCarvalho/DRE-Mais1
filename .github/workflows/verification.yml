name: DRE Mais1 SaaS Verification

on:
  push:
    branches: [main, 'saas-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  saas-web-verification:
    name: SaaS Web - Testes e Build Vite
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Testes frontend - Vitest
        run: npm test

      - name: Typecheck e Build Vite
        run: npm run build

      - name: Instalar Deno para checagem do backend (sem deploy)
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts

      - name: Typecheck da Edge Function de validação
        run: |
          deno check supabase/functions/validate-monthly-reports/index.ts
          deno check supabase/functions/commit-monthly-reports/index.ts

      - name: Testes XLSX reais no runtime Deno
        run: deno test --allow-read supabase/functions/_shared/parseMonthlyReports.deno_test.ts

      - name: Smoke HTTP — Edge validação exige autenticação (PR 5)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 5
        run: |
          status=$(curl -sS --max-time 20 -o /tmp/dre_mais1_edge_auth.json -w '%{http_code}' \
            -X POST 'https://mgtovbvnbkzrdytudynf.supabase.co/functions/v1/validate-monthly-reports' \
            -H 'Content-Type: application/json' --data '{}')
          echo "HTTP unauthenticated: $status"
          test "$status" = '401'

      - name: Smoke HTTP — preflight CORS da Edge (PR 5)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 5
        run: |
          curl -sS --max-time 20 -o /tmp/dre_cors_body -D /tmp/dre_cors_headers \
            -X OPTIONS 'https://mgtovbvnbkzrdytudynf.supabase.co/functions/v1/validate-monthly-reports' \
            -H 'Origin: https://dre-mais1-homologacao.corsys1.workers.dev' \
            -H 'Access-Control-Request-Method: POST'
          grep -E -iq '^HTTP/[0-9.]+ 204' /tmp/dre_cors_headers
          grep -E -iq '^access-control-allow-origin: https://dre-mais1-homologacao.corsys1.workers.dev' /tmp/dre_cors_headers

