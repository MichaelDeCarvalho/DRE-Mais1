name: DRE Mais1 SaaS Verification

on:
  push:
    branches: [main, 'saas-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  saas-web-verification:
    name: SaaS Web - Testes e Build Vite
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Testes frontend - Vitest
        run: npm test

      - name: Typecheck e Build Vite
        run: npm run build

      - name: Instalar Deno para checagem do backend (sem deploy)
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts

      - name: Typecheck da Edge Function de validação
        run: deno check supabase/functions/validate-monthly-reports/index.ts
